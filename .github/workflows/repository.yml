name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check documents and new commit attribution
        run: python3 scripts/check_repository.py --event-path "$GITHUB_EVENT_PATH"
      - name: Test repository checks
        run: python3 -m unittest scripts/test_check_repository.py
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
