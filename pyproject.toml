[project]
name = "maiku"
version = "0.0.1"
description = "The universal adapter for AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
cli = ["typer>=0.15", "rich>=13.9"]
net = ["httpx>=0.28"]
mcp = ["mcp>=1.2"]
llm = ["litellm>=1.55"]
hf = ["transformers>=4.46"]
torch = ["torch>=2.5"]
trace = ["opentelemetry-sdk>=1.29"]

[project.scripts]
maiku = "maiku.cli.main:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "jsonschema>=4.23", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maiku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
